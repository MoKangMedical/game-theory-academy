<style>
/*
 * ═══════════════════════════════════════════
 *  博弈研究院 — 课程中心 v1.0
 *  设计语言: 深色金调 · 学术 · 沉浸
 * ═══════════════════════════════════════════
 */
:root{
  --bg:#07070a; --bg2:#0a0a10; --bg3:#0f0f16;
  --card:#121218; --card2:#18181f; --card3:#1e1e27;
  --border:#22222d; --border2:#2e2e3a;
  --text:#f5f5f7; --text2:#a0a0ab; --text3:#656570;
  --gold:#e2b64f; --gold-light:#f5d98a; --gold-dark:#b8860b;
  --accent1:#e2b64f; --accent2:#22c55e; --accent3:#3b82f6; --accent4:#8b5cf6; --accent5:#f59e0b; --accent6:#ec4899;
  --serif:'Noto Serif SC',serif; --sans:'Inter',-apple-system,sans-serif;
  --radius:14px; --radius-lg:20px; --radius-xl:24px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--bg);color:var(--text);line-height:1.65;letter-spacing:.01em;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}

/* ═══ NAV ═══ */
.nav{position:fixed;top:0;left:0;right:0;z-index:200;background:rgba(7,7,10,0.82);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-bottom:1px solid rgba(255,255,255,0.06)}
.nav-inner{max-width:1260px;margin:0 auto;padding:0 32px;height:64px;display:flex;align-items:center;justify-content:space-between}
.nav-brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:1.05rem;font-weight:700;color:var(--gold);letter-spacing:.02em}
.nav-brand svg{width:26px;height:26px;flex-shrink:0}
.nav-links{display:flex;gap:6px;align-items:center}
.nav-links a{font-size:0.8rem;color:var(--text3);font-weight:500;padding:8px 16px;border-radius:8px;transition:all .25s;letter-spacing:.02em}
.nav-links a:hover,.nav-links a.active{color:var(--text);background:rgba(255,255,255,0.04)}
.nav-links a.active{color:var(--gold)}

/* ═══ HERO ═══ */
.hero{position:relative;padding:140px 0 80px;text-align:center;overflow:hidden;background:radial-gradient(ellipse 70% 50% at 50% 25%,rgba(226,182,79,0.07) 0%,transparent 70%),radial-gradient(ellipse 60% 40% at 80% 60%,rgba(139,92,246,0.04) 0%,transparent 60%)}
.hero::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:80px;background:linear-gradient(to top,var(--bg) 20%,transparent)}
.hero-content{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:0 24px}
.hero-badge{display:inline-block;font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--gold);background:rgba(226,182,79,0.08);border:1px solid rgba(226,182,79,0.15);padding:6px 20px;border-radius:40px;margin-bottom:24px}
.hero h1{font-family:var(--serif);font-size:clamp(2.2rem,5vw,3.2rem);font-weight:900;line-height:1.25;margin-bottom:18px;letter-spacing:-.01em}
.hero h1 .hl{background:linear-gradient(135deg,var(--gold) 20%,var(--gold-light) 60%,var(--gold-dark));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:var(--text2);font-size:1.05rem;line-height:1.8;max-width:560px;margin:0 auto 36px}
.hero-stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.hero-stat{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:14px 22px;text-align:center;min-width:90px;backdrop-filter:blur(8px)}
.hero-stat-num{font-size:1.6rem;font-weight:800;color:var(--gold);font-family:var(--serif);line-height:1}
.hero-stat-label{font-size:0.7rem;color:var(--text3);margin-top:4px;letter-spacing:.04em}

/* ═══ SEARCH ═══ */
.search-wrap{max-width:660px;margin:-20px auto 50px;padding:0 24px;position:relative;z-index:10}
.search-box{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 20px;transition:all .3s}
.search-box:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px rgba(226,182,79,0.08)}
.search-icon{font-size:1.1rem;color:var(--text3);flex-shrink:0}
.search-input{flex:1;background:none;border:none;color:var(--text);font-size:0.95rem;outline:none;font-family:var(--sans)}
.search-input::placeholder{color:var(--text3)}
.search-clear{display:none;background:none;border:none;color:var(--text3);cursor:pointer;font-size:1.1rem;padding:4px}
.search-clear:hover{color:var(--text)}
.search-hint{font-size:0.7rem;color:var(--text3);margin-top:8px;padding-left:4px}

/* ═══ PHASE HEADER ═══ */
.phase-section{margin-bottom:48px;position:relative}
.phase-header{display:flex;align-items:center;gap:14px;padding:20px 24px;margin:0 0 18px;border:1px solid rgba(226,182,79,0.1);border-radius:16px;position:sticky;top:72px;background:rgba(12,12,18,0.94);backdrop-filter:blur(20px);z-index:50;box-shadow:0 10px 30px rgba(0,0,0,0.22)}
.phase-icon{font-size:1.6rem;flex-shrink:0;width:42px;height:42px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(226,182,79,0.14),rgba(226,182,79,0.05));border:1px solid rgba(226,182,79,0.12);border-radius:12px;box-shadow:inset 0 1px 0 rgba(245,217,138,0.14)}
.phase-info{flex:1}
.phase-title{font-family:var(--serif);font-size:1.15rem;font-weight:700;color:var(--gold);letter-spacing:.01em}
.phase-sub{font-size:0.75rem;color:var(--text3);margin-top:2px}
.phase-count{font-size:0.72rem;color:var(--gold);background:rgba(226,182,79,0.08);padding:6px 12px;border-radius:999px;flex-shrink:0;border:1px solid rgba(226,182,79,0.14);box-shadow:inset 0 1px 0 rgba(245,217,138,0.08)}

/* ═══ COURSE CARD ═══ */
.course-grid{display:grid;grid-template-columns:1fr;gap:10px;padding:0 24px;max-width:900px;margin:0 auto}

.course-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:all .3s cubic-bezier(.4,0,.2,1);position:relative}
.course-card::before{content:'';position:absolute;inset:0;opacity:0;transition:opacity .3s;border-radius:var(--radius);background:radial-gradient(600px circle at var(--mouse-x,50%) var(--mouse-y,50%),rgba(226,182,79,0.03),transparent 50%)}
.course-card:hover::before{opacity:1}
.course-card:hover{border-color:rgba(226,182,79,0.22);transform:translateY(-2px);box-shadow:0 14px 34px rgba(226,182,79,0.08)}
.course-card.open{border-color:rgba(226,182,79,0.28);box-shadow:0 16px 40px rgba(226,182,79,0.1)}

.course-row{display:flex;align-items:stretch;padding:18px 22px;gap:16px}
.course-num-wrap{flex-shrink:0;display:flex;align-items:center}
.course-num{width:48px;height:48px;display:flex;align-items:center;justify-content:center;font-size:1.25rem;font-weight:800;color:#111;border-radius:12px;background:linear-gradient(135deg,var(--gold),var(--gold-dark));font-family:var(--serif);position:relative;z-index:1}
.course-num::after{content:'';position:absolute;inset:-2px;border-radius:14px;background:linear-gradient(135deg,var(--gold-light),transparent);opacity:0.3;z-index:-1}
.course-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.course-title{font-size:1.02rem;font-weight:600;color:var(--text);letter-spacing:-.01em;line-height:1.3}
.course-desc{font-size:0.82rem;color:var(--text3);margin-top:4px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.course-tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.course-tag{font-size:0.68rem;font-weight:500;padding:3px 10px;border-radius:6px;letter-spacing:.02em}
.tag-diff{background:rgba(226,182,79,0.1);color:var(--gold-dark);border:1px solid rgba(226,182,79,0.16)}
.tag-diff.beginner{background:rgba(34,197,94,0.1);color:#22c55e}
.tag-diff.core{background:rgba(59,130,246,0.1);color:#60a5fa}
.tag-diff.advanced{background:rgba(139,92,246,0.1);color:#a78bfa}
.tag-diff.master{background:rgba(236,72,153,0.1);color:#f9a8d4}
.tag-time{background:var(--card3);color:var(--text3);border:1px solid rgba(255,255,255,0.04)}
.tag-exercise{background:rgba(34,197,94,0.08);color:#22c55e;font-size:0.65rem}
.course-arrow-wrap{flex-shrink:0;display:flex;align-items:center}
.course-arrow{font-size:1.3rem;color:var(--text3);transition:all .3s;line-height:1}
.course-card.open .course-arrow{transform:rotate(90deg);color:var(--gold)}

/* ═══ EXPANDED CONTENT ═══ */
.course-body{display:none;border-top:1px solid var(--border);background:var(--bg2)}
.course-card.open .course-body{display:block;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.course-body-inner{max-height:65vh;overflow-y:auto;padding:28px 28px 20px}
.course-body-inner::-webkit-scrollbar{width:5px}
.course-body-inner::-webkit-scrollbar-thumb{background:var(--border2);border-radius:10px}
.course-body-inner::-webkit-scrollbar-track{background:transparent}

/* Markdown rendered content */
.md-content{font-size:0.92rem;line-height:1.85;color:var(--text2)}
.md-content h1{font-family:var(--serif);font-size:1.6rem;font-weight:700;color:var(--text);margin:28px 0 14px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.md-content h1:first-child{margin-top:0}
.md-content h2{font-size:1.2rem;font-weight:700;color:var(--text);margin:24px 0 10px;display:flex;align-items:center;gap:8px;padding-left:0}
.md-content h2::before{content:'';width:3px;height:18px;background:var(--gold);border-radius:2px;flex-shrink:0}
.md-content h3{font-size:1.02rem;font-weight:600;color:var(--gold-light);margin:18px 0 8px}
.md-content h4{font-size:0.95rem;font-weight:600;color:var(--text);margin:14px 0 6px}
.md-content p{margin:8px 0}
.md-content strong{color:var(--text);font-weight:600}
.md-content em{color:var(--gold);font-style:italic}
.md-content blockquote{background:linear-gradient(135deg,rgba(226,182,79,0.06),rgba(226,182,79,0.02));border-left:3px solid var(--gold);padding:14px 18px;margin:14px 0;border-radius:0 8px 8px 0;color:var(--text);font-size:0.93rem}
.md-content blockquote p{margin:4px 0}
.md-content ul,.md-content ol{padding-left:22px;margin:10px 0}
.md-content li{margin:5px 0;color:var(--text2)}
.md-content li::marker{color:var(--gold-dark)}
.md-content code{background:var(--card3);color:var(--gold-light);padding:2px 7px;border-radius:5px;font-size:0.85rem}
.md-content pre{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:16px 20px;margin:14px 0;overflow-x:auto}
.md-content pre code{background:none;padding:0;color:var(--text2);font-size:0.85rem}
.md-content hr{border:none;border-top:1px solid var(--border);margin:20px 0}
.md-content table{width:100%;border-collapse:collapse;margin:14px 0;font-size:0.85rem;border-radius:8px;overflow:hidden;border:1px solid var(--border)}
.md-content th{background:rgba(226,182,79,0.08);color:var(--gold);font-weight:600;text-align:left;padding:10px 14px;border-bottom:2px solid rgba(226,182,79,0.2);font-size:0.8rem}
.md-content td{padding:10px 14px;border-bottom:1px solid rgba(255,255,255,0.04);color:var(--text2)}
.md-content tr:last-child td{border-bottom:none}
.md-content tr:nth-child(even){background:rgba(255,255,255,0.015)}
.md-content details{margin:10px 0;background:var(--card2);border-radius:8px;padding:12px 16px;border:1px solid var(--border)}
.md-content details summary{cursor:pointer;color:var(--gold);font-weight:500;font-size:0.9rem;padding:4px 0}
.md-content details[open] summary{margin-bottom:8px}
.md-content details p,.md-content details li{font-size:0.85rem;color:var(--text3)}

.course-body-actions{display:flex;gap:10px;padding:12px 28px 22px;border-top:1px solid rgba(255,255,255,0.03)}
.btn-start{display:inline-flex;align-items:center;gap:8px;padding:10px 22px;background:var(--gold);color:#111;font-weight:600;border-radius:10px;font-size:0.85rem;transition:all .25s;letter-spacing:.01em}
.btn-start:hover{background:var(--gold-light);transform:translateY(-1px)}
.btn-audio{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;background:var(--card3);color:var(--text2);border:1px solid var(--border);border-radius:10px;font-size:0.8rem;cursor:pointer;transition:all .25s}
.btn-audio:hover{border-color:var(--gold);color:var(--gold)}

/* ═══ BACK TO TOP ═══ */
.back-top{position:fixed;bottom:28px;right:28px;width:44px;height:44px;background:var(--gold);color:#111;border:none;border-radius:50%;font-size:1.2rem;cursor:pointer;z-index:99;opacity:0;transform:translateY(12px);transition:all .3s;box-shadow:0 4px 16px rgba(226,182,79,0.2);display:flex;align-items:center;justify-content:center}
.back-top.visible{opacity:1;transform:translateY(0)}
.back-top:hover{background:var(--gold-light);transform:translateY(-3px);box-shadow:0 6px 24px rgba(226,182,79,0.3)}

/* ═══ SECTION DIVIDER ═══ */
.divider{display:flex;align-items:center;gap:16px;margin:18px 24px 38px;max-width:900px;margin-left:auto;margin-right:auto;opacity:0.5}
.divider-line{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent)}
.divider-icon{font-size:0.8rem;color:var(--gold)}
.divider:last-child{display:none}

/* ═══ FOOTER ═══ */
.footer{padding:40px 24px 32px;text-align:center;border-top:1px solid var(--border);margin-top:32px}
.footer p{font-size:0.75rem;color:var(--text3);line-height:1.7}
.footer .blue{color:var(--gold-dark)}

/* ═══ RESPONSIVE ═══ */
@media(max-width:768px){
  .hero{padding:120px 0 60px}
  .hero h1{font-size:1.8rem}
  .hero-stats{gap:6px}
  .hero-stat{padding:10px 14px;min-width:70px}
  .hero-stat-num{font-size:1.3rem}
  .course-row{padding:14px 16px;gap:12px}
  .course-num{width:40px;height:40px;font-size:1.1rem;border-radius:10px}
  .course-title{font-size:0.95rem}
  .course-body-inner{padding:20px 16px}
  .course-body-actions{padding:10px 16px 18px}
  .md-content table{font-size:0.7rem}
  .md-content th,.md-content td{padding:6px 8px}
  .phase-header{padding:12px 16px}
  .phase-title{font-size:1rem}
}
@media(min-width:1200px){
  .course-grid{padding:0}
  .phase-header{padding:18px 0}
  .divider{margin-left:auto;margin-right:auto;padding:0}
}
</style>
</head>

}

// ═══ Simple Markdown Parser ═══
function parseMd(md) {
  if (!md) return '';
  let html = md
    .replace(/^# .+\n?/m, '')
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^#### (.+)$/gm, '<h4>$1</h4>')
    .replace(/^> (.+)$/gm, '<blockquote><p>$1</p></blockquote>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/^---$/gm, '<hr>')
    .replace(/^\|(.+)\|$/gm, function(m) {
      const cells = m.replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      if (cells.every(c => /^[-:]+$/.test(c))) return '<!--sep-->';
      return '<tr>' + cells.map(c => `<td>${c}</td>`).join('') + '</tr>';
    })
    .replace(/- (.+)$/gm, '<li>$1</li>')
    .replace(/^\d+\. (.+)$/gm, '<li>$1</li>')
    .replace(/```[\s\S]*?```/g, function(m) {
      const code = m.replace(/```\w*\n?/, '').replace(/```$/, '');
      return '<pre><code>' + code.trim() + '</code></pre>';
    })
    .replace(/\n\n/g, '</p><p>')
    .replace(/<!--sep-->/g, '');
  
  html = '<p>' + html + '</p>';
  html = html.replace(/<p><\/p>/g, '')
    .replace(/<p>(<h[234]|<blockquote|<pre|<hr|<table|<tr|<ul|<ol|<li|<details)/g, '$1')
    .replace(/(<\/h[234]>|<\/blockquote>|<\/pre>|<\/table>|<\/ul>|<\/ol>)<\/p>/g, '$1')
    .replace(/<p><li>/g, '<ul><li>')
    .replace(/<\/li><\/p>/g, '</li></ul>')
    .replace(/<\/ul><ul>/g, '')
    .replace(/<p><tr>/g, '<table><tr>')
    .replace(/<\/tr><\/p>/g, '</tr></table>')
    .replace(/<td><\/td>/g, '<td></td>');
  
  return html;
}

// ═══ Load Course Content ═══
function loadCourseContent(card) {
  const file = card.getAttribute('data-file');
  const num = card.getAttribute('data-course');
  const mdEl = document.getElementById('md-' + num);
  if (!mdEl || mdEl.getAttribute('data-loaded')) return;
  
  mdEl.setAttribute('data-loaded', '1');
  fetch(file)
    .then(r => r.ok ? r.text() : Promise.reject())
    .then(md => { mdEl.innerHTML = parseMd(md); })
    .catch(() => { mdEl.innerHTML = '<p style="color:var(--text3)">内容加载失败，请稍后重试。</p>'; });
}

// ═══ Toggle Card ═══
function toggleCard(card) {
  const wasOpen = card.classList.contains('open');
  document.querySelectorAll('.course-card.open').forEach(c => c.classList.remove('open'));
  if (!wasOpen) {
    card.classList.add('open');
    loadCourseContent(card);
    setTimeout(() => {
      card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }, 50);
  }
}

// ═══ Search ═══
const searchInput = document.getElementById('searchInput');
const searchClear = document.getElementById('searchClear');
const searchHint = document.getElementById('searchHint');
const totalCourseCount = allCards.length;

function getDefaultSearchHint() {
  return `共 <strong>${totalCourseCount}</strong> 份课程内容 · 含 50 门核心课程与 1 份总览`;
}

searchInput.addEventListener('input', function() {
  const term = this.value.toLowerCase().trim();
  searchClear.style.display = term ? 'block' : 'none';
  
  let visibleCount = 0;
  allCards.forEach(card => {
    const title = (card.getAttribute('data-title') || '').toLowerCase();
    const phase = (card.getAttribute('data-phase') || '').toLowerCase();
    const desc = card.querySelector('.course-desc')?.textContent?.toLowerCase() || '';
    const match = !term || title.includes(term) || phase.includes(term) || desc.includes(term);
    
    card.style.display = match ? '' : 'none';
    if (match) visibleCount++;
    
    const section = card.closest('.phase-section');
    if (section) {
      const visibleCards = section.querySelectorAll('.course-card:not([style*="display: none"])');
      section.style.display = visibleCards.length ? '' : 'none';
    }
  });
  
  document.querySelectorAll('.phase-section').forEach(sec => {
    const divider = sec.querySelector('.divider');
    if (divider && sec.style.display === 'none') divider.style.display = 'none';
    else if (divider) divider.style.display = '';
  });
  
  searchHint.innerHTML = term 
    ? `找到 <strong>${visibleCount}</strong> 份匹配内容`
    : getDefaultSearchHint();
});

searchClear.addEventListener('click', function() {
  searchInput.value = '';
  searchInput.dispatchEvent(new Event('input'));
  searchInput.focus();
});

    setTimeout(() => {
      const card = document.querySelector(`[data-course="${num}"]`);
      if (card) {
        card.classList.add('open');
        loadCourseContent(card);
        card.scrollIntoView({ behavior: 'smooth' });
      }
    }, 300);
  }
}

// ═══ Keyboard Navigation ═══
document.addEventListener('keydown', function(e) {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
    e.preventDefault();
    searchInput.focus();
  }
  if (e.key === 'Escape') {
    document.querySelectorAll('.course-card.open').forEach(c => c.classList.remove('open'));
    searchInput.blur();
  }
});

// ═══ Mouse tracking for card glow ═══
allCards.forEach(card => {
  card.addEventListener('mousemove', function(e) {
    const rect = card.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width) * 100;
    const y = ((e.clientY - rect.top) / rect.height) * 100;
    card.style.setProperty('--mouse-x', x + '%');
    card.style.setProperty('--mouse-y', y + '%');
  });
});
</script>
</body>
</html>
